<body class="pb-28">
<div id="lockScreen" style="position:fixed;inset:0;background:#0f172a;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px">
  <div style="background:white;padding:30px;border-radius:20px;width:100%;max-width:350px;text-align:center">
    <h2 style="margin-bottom:8px;font-weight:bold;font-size:22px;color:#111">☁️ حدادة فراس V3.7</h2>
    <p style="margin-bottom:15px;color:#666;font-size:13px">سجل دخولك حتى تنحفظ بياناتك</p>
    <button onclick="loginGoogle()" style="width:100%;padding:12px;background:white;color:#111;border:2px solid #ddd;border-radius:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:8px">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> تسجيل الدخول بـ Google
    </button>
    <p style="margin:12px 0;color:#aaa;font-size:11px">او</p>
    <input id="passInput" type="password" placeholder="••••••••" style="width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin-bottom:12px;text-align:center;color:#111">
    <button onclick="checkPass()" style="width:100%;padding:12px;background:#16a34a;color:white;border-radius:10px;font-weight:bold">دخول بالرمز القديم</button>
    <p id="passError" style="color:red;margin-top:10px;display:none"></p>
    <p id="passInfo" style="color:#16a34a;margin-top:10px;display:none;font-size:12px"></p>
  </div>
</div>
<header class="p-4 flex justify-between items-center sticky top-0 z-20 bg-[#0f0f0f]">
<div><h1 class="font-black">حدادة فراس <span class="text-amber-400">V3.7 ☁️ Firebase</span><br><span id="userEmailDisplay" style="font-size:10px;color:#888"></span></h1></div>
<div class="flex gap-2">
<button onclick="openBackup()" class="glass w-10 h-10 rounded-full"><i class="fa-solid fa-floppy-disk"></i></button>
<button onclick="openArchive()" class="glass w-10 h-10 rounded-full"><i class="fa-solid fa-box-archive"></i></button>
<button onclick="logout()" class="glass w-10 h-10 rounded-full text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button>

<div class="px-4 grid grid-cols-3 gap-2 mt-2">
<div class="glass rounded-2xl p-3 text-center"><p class="text-[10px] text-zinc-400">العمال</p><p class="en-num font-black" id="totalWorkers">0</p></div>
<div class="glass rounded-2xl p-3 text-center"><p class="text-[10px] text-zinc-400">حضور اليوم</p><p class="en-num font-black text-green-400" id="todayPresent">0</p></div>
<div class="glass rounded-2xl p-3 text-center"><p class="text-[10px] text-zinc-400">أجور الأسبوع</p><p class="en-num font-black text-amber-400 text-[11px]" id="weekTotal">0</p></div>
</div>
<div class="px-4 mt-2 text-[10px] text-center opacity-50" id="cloudStatus">☁️ Firebase - غير متصل</div>

<button onclick="markAll(1)" class="bg-zinc-800 py-3 rounded-xl text-[10px] font-bold">الكل حاضر</button>
<button onclick="markAll(0.5)" class="bg-zinc-800 py-3 rounded-xl text-[10px] font-bold">الكل نص</button>

</div>

<div id="profileModal" class="fixed inset-0 bg-black z-50 hidden overflow-y-auto"><div class="p-4 pb-20">
<div class="flex justify-between items-center">
<button onclick="closeProfile()" class="w-10 h-10 glass rounded-full"><i class="fa-solid fa-xmark"></i></button>
<button onclick="editCurrentWorker()" class="bg-white text-black px-4 py-2 rounded-full text-xs font-black">تعديل</button>
</div>
<div id="profileContent" class="mt-4"></div>
</div></div>
<div id="addModal" class="fixed inset-0 bg-black/90 z-[60] hidden"><div class="bg-zinc-900 w-full mt-auto rounded-t-[30px] p-6 absolute bottom-0">

<label class="w-24 h-24 rounded-full bg-zinc-800 flex items-center justify-center overflow-hidden mx-auto mb-4 border-2 border-dashed border-zinc-600 cursor-pointer">
<input type="file" id="photoInput" hidden accept="image/*" onchange="previewPhoto(event)"><img id="photoPreview" class="w-full h-full object-cover hidden"><i id="photoIcon" class="fa-solid fa-camera"></i></label>
<input id="wName" placeholder="اسم العامل" class="w-full bg-zinc-800 rounded-xl p-4 mb-3 outline-none">

</div></div>



<div id="confirmModal" class="fixed inset-0 bg-black/80 z-[70] hidden items-center justify-center p-6"><div class="bg-zinc-900 rounded-[24px] p-6 w-full max-w-sm text-center border border-white/10">

<div class="flex gap-2"><button id="confirmYes" class="flex-1 bg-green-500 text-black font-black py-4 rounded-xl">تأكيد</button><button onclick="closeConfirm()" class="flex-1 bg-zinc-800 py-4 rounded-xl">إلغاء</button></div>
</div></div>
<div id="hoursModal" class="fixed inset-0 bg-black/80 z-[70] hidden items-center justify-center p-6"><div class="bg-zinc-900 rounded-[24px] p-6 w-full max-w-sm border border-white/10">

<div class="grid grid-cols-4 gap-2 mb-4">
<button onclick="setHours(1)" class="bg-zinc-800 py-3 rounded-xl">1</button>
<button onclick="setHours(2)" class="bg-zinc-800 py-3 rounded-xl">2</button>
<button onclick="setHours(3)" class="bg-zinc-800 py-3 rounded-xl">3</button>
<button onclick="setHours(4)" class="bg-zinc-800 py-3 rounded-xl">4</button>
</div>
<div class="flex gap-2"><input id="customHours" type="number" step="0.5" placeholder="2.5" class="flex-1 bg-zinc-800 rounded-xl p-3 en-num"><button onclick="setCustomHours()" class="bg-amber-400 text-black font-bold px-6 rounded-xl">حفظ</button></div>
<button onclick="closeHours()" class="w-full mt-3 bg-zinc-800 py-3 rounded-xl text-xs">إلغاء</button>
</div></div>
<div id="archiveModal" class="fixed inset-0 bg-black z-[55] hidden overflow-y-auto p-4"><button onclick="closeArchive()" class="w-10 h-10 glass rounded-full mb-4"><i class="fa-solid fa-xmark"></i></button><h2 class="font-black text-xl mb-4">الأرشيف</h2><div id="archiveList"></div></div>
<div id="backupModal" class="fixed inset-0 bg-black/90 z-[55] hidden"><div class="bg-zinc-900 w-full mt-auto rounded-t-[30px] p-6 absolute bottom-0">
<h2 class="font-black mb-4">نسخ احتياطي ☁️ Firebase</h2>
<button onclick="exportBackup()" class="w-full bg-white text-black font-bold py-4 rounded-xl mb-2">تصدير JSON</button>
<label class="w-full bg-zinc-800 py-4 rounded-xl flex items-center justify-center cursor-pointer mb-2">استيراد ملف<input type="file" id="importFile" hidden accept=".json" onchange="importBackup(event)"></label>
<button onclick="cloudSaveReal()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl mb-2">☁️ حفظ سحابي يدوي</button>
<button onclick="closeBackup()" class="w-full mt-3 bg-zinc-800 py-3 rounded-xl">إغلاق</button>
</div></div>

<script>
// Firebase - نفس مشروعك
const firebaseConfig = {
  apiKey: "AIzaSyDYUL13ThZeljnbr-Wmz8vcK9TTvOBTdaU",
  authDomain: "firas-hadada.firebaseapp.com",
  projectId: "firas-hadada",
  storageBucket: "firas-hadada.firebasestorage.app",
  messagingSenderId: "761230966514",
  appId: "1:761230966514:web:f5bf00b9253f82c5015a6b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let workers=JSON.parse(localStorage.getItem('firas_v3_workers')||'[]');
let attendance=JSON.parse(localStorage.getItem('firas_v3_att')||'{}');
let advances=JSON.parse(localStorage.getItem('firas_v3_adv')||'{}');
let archive=JSON.parse(localStorage.getItem('firas_v3_archive')||'[]');
let currentProfileId=null,currentWeekStart=getWeekStart(new Date()),tempPhoto=null,pendingAction=null,hoursTarget=null,isBulkHours=false;
const SITE_PASS = "Nawroz123@";
let currentUserId = null;

// ========= تم اصلاح زر Google =========
function loginGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  const errBox = document.getElementById('passError');
  const infoBox = document.getElementById('passInfo');
  errBox.style.display='block';
  errBox.style.color='#fbbf24';
  errBox.innerText = "⏳ جاري فتح Google... انتظر";
  infoBox.style.display='none';
  auth.signInWithRedirect(provider).catch(e=>{
    errBox.style.color='red';
    errBox.innerText = "خطأ Google: " + e.code + " - " + e.message + "\nتأكد اضفت firas-haddad.github.io في Authorized domains";
    console.error(e);
  });
}
auth.getRedirectResult().then((r)=>{
  if(r && r.user){
    document.getElementById('passInfo').style.display='block';
    document.getElementById('passInfo').innerText = "✅ تم: "+r.user.email;
  }
}).catch(e=>{
  const errBox = document.getElementById('passError');
  errBox.style.display='block';
  errBox.innerText = "خطأ Redirect: " + e.code + " - " + e.message;
  console.error(e);
});

function logout(){ auth.signOut().then(()=>{ localStorage.removeItem('siteAuth'); location.reload(); }); }
auth.onAuthStateChanged(user=>{
  if(user){
    currentUserId = user.uid;
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('userEmailDisplay').innerText = user.displayName+" - "+user.email;
    const cs = document.getElementById('cloudStatus');
    if(cs) cs.innerText = "☁️ جاري تحميل Firebase...";
    cloudLoad();
  } else {
    if(localStorage.getItem('siteAuth')==='1'){ document.getElementById('lockScreen').style.display='none'; cloudLoad(); }
    else { document.getElementById('lockScreen').style.display='flex'; }
  }
});
async function cloudLoad(){
  try{
    const cs = document.getElementById('cloudStatus');
    if(!currentUserId){ if(cs) cs.innerText="☁️ محلي - سجل بـ Google للحفظ"; render(); return; }
    const doc = await db.collection('firas_data').doc(currentUserId).get();
    if(doc.exists){
      const d=doc.data();
      if(d.workers){ workers=d.workers; attendance=d.attendance||{}; advances=d.advances||{}; archive=d.archive||[]; }
      if(cs) cs.innerText="☁️ تم التحميل ✅ "+workers.length+" عامل";
    } else { if(cs) cs.innerText="☁️ جديد - جاهز"; cloudSaveReal(); }
    render();
  }catch(e){ const cs=document.getElementById('cloudStatus'); if(cs) cs.innerText="☁️ خطأ: "+e.message; }
}
async function cloudSaveReal(){
  try{
    const data={workers,attendance,advances,archive,updated:new Date().toISOString(),email:auth.currentUser?auth.currentUser.email:""};
    if(currentUserId){ await db.collection('firas_data').doc(currentUserId).set(data,{merge:true}); const cs=document.getElementById('cloudStatus'); if(cs){cs.innerText="☁️ تم الحفظ ✅ "+new Date().toLocaleTimeString('ar-IQ'); setTimeout(()=>{cs.innerText="☁️ Firebase متزامن ✅";},2000);} }
    localStorage.setItem('firas_v3_workers',JSON.stringify(workers));
    localStorage.setItem('firas_v3_att',JSON.stringify(attendance));
    localStorage.setItem('firas_v3_adv',JSON.stringify(advances));
    localStorage.setItem('firas_v3_archive',JSON.stringify(archive));
  }catch(e){ console.error(e); }
}
function getWeekStart(d){let dt=new Date(d);let day=dt.getDay();let diff=day===6?0:day+1;dt.setDate(dt.getDate()-diff);dt.setHours(0,0,0,0);return dt;}
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function en(n){return Number(n||0).toLocaleString('en-US');}
function formatDays(n){ if(!n) return "0 أيام"; let v = Math.round(n*10)/10; return (v%1===0? v.toFixed(0) : v.toFixed(1)) + " أيام"; }
function getWeekDays(){let a=[];for(let i=0;i<7;i++){let d=new Date(currentWeekStart);d.setDate(currentWeekStart.getDate()+i);a.push(d);}return a;}
function save(){localStorage.setItem('firas_v3_workers',JSON.stringify(workers));localStorage.setItem('firas_v3_att',JSON.stringify(attendance));localStorage.setItem('firas_v3_adv',JSON.stringify(advances));localStorage.setItem('firas_v3_archive',JSON.stringify(archive));render();if(currentProfileId)renderProfile(currentProfileId);cloudSaveReal();}
function attendanceToFraction(v){if(v===true)return 1;if(!v)return 0;if(typeof v==='number')return v;return 0;}
function render(){
let list=document.getElementById('workersList');list.innerHTML='';let todayStr=fmt(new Date());let present=0,weekTotal=0;let weekDays=getWeekDays();
workers.forEach(w=>{
let frac=attendanceToFraction(attendance[w.id]?attendance[w.id][todayStr]:0);if(frac>0)present++;
let weekSum=weekDays.reduce((s,d)=>s+attendanceToFraction(attendance[w.id]?attendance[w.id][fmt(d)]:0),0);
weekTotal+=weekSum*w.wage;
let statusText=frac==0?'غائب':frac==1?'حاضر':frac==0.5?'نص يوم':`${frac*8}س`;
let div=document.createElement('div');div.className='glass rounded-[20px] p-4 flex items-center justify-between';
div.innerHTML=`<div class="flex items-center gap-3" onclick="openProfile('${w.id}')"><div class="w-14 h-14 rounded-full overflow-hidden bg-zinc-800 flex-shrink-0">${w.photo?`<img src="${w.photo}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center text-zinc-500"><i class="fa-solid fa-user"></i></div>`}</div><div><p class="font-bold">${w.name}</p><p class="text-[11px] text-zinc-400"><span class="en-num">${en(w.wage)}</span> د.ع • ${statusText}</p></div></div><button onclick="quickToggle('${w.id}')" class="w-10 h-10 rounded-full ${frac>0?'bg-green-500 text-black':'bg-zinc-800'}"><i class="fa-solid fa-check"></i></button>`;
list.appendChild(div);
});
document.getElementById('totalWorkers').innerText=workers.length;
document.getElementById('todayPresent').innerText=present;
document.getElementById('weekTotal').innerText=en(Math.round(weekTotal));
}
function quickToggle(id){let today=fmt(new Date());let cur=attendanceToFraction(attendance[id]?attendance[id][today]:0);if(cur>0){askConfirm('حذف حضور اليوم؟','',()=>{delete attendance[id][today];save();});}else{askConfirm('تسجيل حضور؟','',()=>{if(!attendance[id])attendance[id]={};attendance[id][today]=1;save();});}}
function markAll(val){let labels={1:`حضور الكل اليوم؟`,0.5:`نص يوم للكل؟`,0:`غياب الكل؟`};askConfirm(labels[val],`التاريخ ${fmt(new Date())} - ${workers.length} عامل`,()=>{let today=fmt(new Date());workers.forEach(w=>{if(!attendance[w.id])attendance[w.id]={};if(val===0)delete attendance[w.id][today];else attendance[w.id][today]=val;});save();});}
function markAllHours(){isBulkHours=true;document.getElementById('hoursModal').style.display='flex';}
function askConfirm(t,s,a){document.getElementById('confirmText').innerText=t;document.getElementById('confirmSub').innerText=s||'';pendingAction=a;document.getElementById('confirmModal').style.display='flex';}
function closeConfirm(){document.getElementById('confirmModal').style.display='none';pendingAction=null;}
document.getElementById('confirmYes').onclick=()=>{if(pendingAction)pendingAction();closeConfirm();};
function openAddWorker(){document.getElementById('addModal').style.display='flex';document.getElementById('modalTitle').innerText='إضافة عامل جديد';document.getElementById('editId').value='';document.getElementById('wName').value='';document.getElementById('wWage').value='';tempPhoto=null;document.getElementById('photoPreview').classList.add('hidden');document.getElementById('photoIcon').classList.remove('hidden');}
function closeAdd(){document.getElementById('addModal').style.display='none';}
function previewPhoto(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas');let size=400;canvas.width=size;canvas.height=size;let ctx=canvas.getContext('2d');let min=Math.min(img.width,img.height);let sx=(img.width-min)/2,sy=(img.height-min)/2;ctx.drawImage(img,sx,sy,min,min,0,0,size,size);tempPhoto=canvas.toDataURL('image/jpeg',0.75);document.getElementById('photoPreview').src=tempPhoto;document.getElementById('photoPreview').classList.remove('hidden');document.getElementById('photoIcon').classList.add('hidden');};img.src=ev.target.result;};reader.readAsDataURL(file);}
function saveWorker(){let n=document.getElementById('wName').value.trim(),w=parseInt(document.getElementById('wWage').value),editId=document.getElementById('editId').value;if(!n||!w)return alert('اكمل البيانات');if(editId){let worker=workers.find(x=>x.id==editId);worker.name=n;worker.wage=w;if(tempPhoto)worker.photo=tempPhoto;}else{let id=Date.now().toString();workers.push({id,name:n,wage:w,photo:tempPhoto});attendance[id]={};advances[id]=0;}tempPhoto=null;closeAdd();save();}
function editCurrentWorker(){let w=workers.find(x=>x.id==currentProfileId);if(!w)return;document.getElementById('modalTitle').innerText='تعديل العامل';document.getElementById('editId').value=w.id;document.getElementById('wName').value=w.name;document.getElementById('wWage').value=w.wage;tempPhoto=w.photo||null;if(w.photo){document.getElementById('photoPreview').src=w.photo;document.getElementById('photoPreview').classList.remove('hidden');document.getElementById('photoIcon').classList.add('hidden');}document.getElementById('addModal').style.display='flex';}
function openProfile(id){currentProfileId=id;document.getElementById('profileModal').style.display='block';renderProfile(id);}
function closeProfile(){document.getElementById('profileModal').style.display='none';currentProfileId=null;}
function renderProfile(id){
let w=workers.find(x=>x.id==id);let weekDays=getWeekDays();
let weekSum=weekDays.reduce((s,d)=>s+attendanceToFraction(attendance[id]?attendance[id][fmt(d)]:0),0);
let total=Math.round(weekSum*w.wage);let adv=advances[id]||0;let net=total-adv;
let html=`<div class="glass rounded-[24px] p-5 text-center"><div class="w-20 h-20 mx-auto rounded-full overflow-hidden bg-zinc-800 border-2 border-amber-400 mb-2">${w.photo?`<img src="${w.photo}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center"><i class="fa-solid fa-user"></i></div>`}</div><h2 class="font-black text-xl">${w.name}</h2><p class="en-num text-amber-400 font-bold">${en(w.wage)} د.ع</p><div class="grid grid-cols-3 gap-2 mt-4"><div class="bg-zinc-800 rounded-xl p-2"><p class="text-[9px] text-zinc-400">حضور</p><p class="en-num font-black text-[11px]">${formatDays(weekSum)}</p></div><div class="bg-zinc-800 rounded-xl p-2"><p class="text-[9px] text-zinc-400">المستحق</p><p class="en-num font-black text-green-400">${en(total)}</p></div><div class="bg-zinc-800 rounded-xl p-2"><p class="text-[9px] text-zinc-400">الصافي</p><p class="en-num font-black text-amber-400">${en(net)}</p></div></div></div><div class="mt-4 flex justify-between items-center"><button onclick="changeWeek(-1)" class="w-9 h-9 glass rounded-full"><i class="fa-solid fa-chevron-right"></i></button><p class="en-num text-xs font-bold">${fmt(weekDays[0])} الى ${fmt(weekDays[6])}</p><button onclick="changeWeek(1)" class="w-9 h-9 glass rounded-full"><i class="fa-solid fa-chevron-left"></i></button></div><div class="glass rounded-[18px] mt-2 overflow-hidden">${weekDays.map(d=>{let ds=fmt(d);let frac=attendanceToFraction(attendance[id]?attendance[id][ds]:0);let isFriday=d.getDay()===5;let label=isFriday?'عطلة - الجمعة':frac==0?'غائب':frac==1?'حاضر':frac==0.5?'نص يوم':`${frac*8} ساعات`;let fridayClass=isFriday?'bg-amber-500/15 border border-amber-500/30':'';return `<div class="p-3 border-b border-white/5 ${fridayClass}"><div class="flex justify-between items-center"><div><p class="text-xs font-bold ${isFriday?'text-amber-400':''}">${d.toLocaleDateString('ar-IQ',{weekday:'long'})} ${isFriday?'⭐':''}</p><p class="en-num text-[11px] text-zinc-400">${fmt(d)} • <span class="${isFriday?'text-amber-400 font-bold':'text-amber-400'}">${label}</span></p></div><span class="en-num text-[10px] bg-zinc-800 px-2 py-1 rounded-full">${frac>0?en(Math.round(frac*w.wage))+' د.ع':'0'}</span></div><div class="grid grid-cols-4 gap-1 mt-2"><button onclick="askSetDay('${id}','${ds}',1)" class="py-2 rounded-full text-[11px] font-bold ${frac==1?'bg-green-500 text-black':'bg-zinc-800'}">حاضر</button><button onclick="askSetDay('${id}','${ds}',0.5)" class="py-2 rounded-full text-[11px] font-bold ${frac==0.5?'bg-amber-400 text-black':'bg-zinc-800'}">نص</button><button onclick="openHours('${id}','${ds}')" class="py-2 rounded-full text-[11px] ${(frac>0&&frac<1&&frac!=0.5)?'bg-blue-500 text-white':'bg-zinc-800'}">ساعات</button><button onclick="askSetDay('${id}','${ds}',0)" class="py-2 rounded-full text-[11px] ${frac==0?'bg-red-500/20 text-red-400':'bg-zinc-800'}">غائب</button></div></div>`;}).join('')}</div><div class="glass rounded-[18px] p-4 mt-4"><p class="text-xs font-bold mb-2">السلف</p><div class="flex gap-2"><input id="advInput" type="number" placeholder="0" class="flex-1 bg-zinc-800 rounded-xl p-3 en-num outline-none"><button onclick="addAdvance('${id}')" class="bg-amber-400 text-black font-bold px-5 rounded-xl">إضافة</button></div><p class="text-[11px] text-zinc-400 mt-2">مجموع السلف: <span class="en-num">${en(adv)}</span></p></div><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="settleWeek('${id}')" class="bg-white text-black font-black py-4 rounded-xl text-sm">تصفية وتصفير</button><button onclick="sendWhatsAppImage('${id}')" class="bg-[#25D366] text-black font-black py-4 rounded-xl text-sm">إرسال كصورة</button></div><div class="grid grid-cols-1 gap-2 mt-2"><button onclick="sendWhatsApp('${id}')" class="bg-[#25D366]/20 border border-[#25D366]/30 text-[#25D366] font-bold py-4 rounded-xl text-sm">إرسال كشف مفصل واتساب</button></div><div class="mt-3 grid grid-cols-2 gap-2"><button onclick="deleteWorker('${id}')" class="bg-red-500/10 border border-red-500/30 text-red-400 font-bold py-3 rounded-xl text-xs">حذف العامل</button><button onclick="closeProfile()" class="bg-zinc-800 py-3 rounded-xl text-xs">إغلاق</button></div>`;
document.getElementById('profileContent').innerHTML=html;
}
function askSetDay(wId,date,val){askConfirm(val==1?'حاضر كامل؟':val==0.5?'نص يوم؟':'غياب؟',`التاريخ ${date}`,()=>{if(!attendance[wId])attendance[wId]={};if(val==0)delete attendance[wId][date];else attendance[wId][date]=val;save();});}
function openHours(wId,date){hoursTarget={wId,date};isBulkHours=false;document.getElementById('hoursModal').style.display='flex';}
function closeHours(){document.getElementById('hoursModal').style.display='none';hoursTarget=null;isBulkHours=false;document.getElementById('customHours').value='';}
function setHours(h){if(isBulkHours){let frac=h/8;let today=fmt(new Date());workers.forEach(w=>{if(!attendance[w.id])attendance[w.id]={};attendance[w.id][today]=frac;});closeHours();save();return;}if(!hoursTarget)return;let frac=h/8;if(!attendance[hoursTarget.wId])attendance[hoursTarget.wId]={};attendance[hoursTarget.wId][hoursTarget.date]=frac;closeHours();save();}
function setCustomHours(){let h=parseFloat(document.getElementById('customHours').value);if(!h)return;setHours(h);}
function changeWeek(d){let nd=new Date(currentWeekStart);nd.setDate(nd.getDate()+(d*7));currentWeekStart=nd;save();}
function addAdvance(id){let v=parseInt(document.getElementById('advInput').value);if(!v)return;advances[id]=(advances[id]||0)+v;document.getElementById('advInput').value='';save();}
function settleWeek(id){askConfirm('تصفية وتصفير الأسبوع؟','سيتم حفظ التفاصيل في الأرشيف',()=>{let w=workers.find(x=>x.id==id);let weekDays=getWeekDays();let weekSum=weekDays.reduce((s,d)=>s+attendanceToFraction(attendance[id]?attendance[id][fmt(d)]:0),0);if(weekSum==0)return alert('لا يوجد حضور');let total=Math.round(weekSum*w.wage);let adv=advances[id]||0;let daysData=weekDays.map(d=>{let ds=fmt(d);let frac=attendanceToFraction(attendance[id]?attendance[id][ds]:0);let isFriday=d.getDay()===5;let label=isFriday?'عطلة - الجمعة':frac==0?'غائب':frac==1?'حاضر':frac==0.5?'نص يوم':`${frac*8} ساعات`;return {date:ds, dayName:d.toLocaleDateString('ar-IQ',{weekday:'long'}), frac, label, amount:Math.round(frac*w.wage), isFriday};});let rec={id:Date.now().toString(),workerId:id,workerName:w.name,weekStart:fmt(weekDays[0]),weekEnd:fmt(weekDays[6]),days:weekSum,wage:w.wage,total,adv,net:total-adv,date:fmt(new Date()), daysData};archive.unshift(rec);weekDays.forEach(d=>{let ds=fmt(d);if(attendance[id])delete attendance[id][ds];});advances[id]=0;save();openArchive();});}
function deleteWorker(id){askConfirm('حذف العامل نهائياً؟','',()=>{workers=workers.filter(w=>w.id!=id);delete attendance[id];delete advances[id];closeProfile();save();});}
function deleteArchiveRec(id){askConfirm('حذف سجل الأرشيف؟','لا يمكن التراجع',()=>{archive=archive.filter(x=>x.id!=id);save();openArchive();});}
function openArchive(){document.getElementById('archiveModal').style.display='block';let list=document.getElementById('archiveList');list.innerHTML=archive.length?archive.map(r=>{let daysHtml = r.daysData? r.daysData.map(d=>`<div class="flex justify-between text-[11px] py-1 border-b border-white/5"><span>${d.dayName} ${d.date} ${d.isFriday?'⭐':''}</span><span class="${d.frac>0?'text-green-400':d.isFriday?'text-amber-400':'text-zinc-500'}">${d.label}</span></div>`).join('') : '';return `<div class="glass rounded-xl p-4 mb-3"><div class="flex justify-between items-start"><div><p class="font-bold">${r.workerName}</p><p class="en-num text-xs text-zinc-400">${r.weekStart} الى ${r.weekEnd} • ${formatDays(r.days)} • ${r.date}</p></div><button onclick="deleteArchiveRec('${r.id}')" class="w-8 h-8 bg-red-500/20 text-red-400 rounded-full"><i class="fa-solid fa-trash"></i></button></div><div class="mt-3 bg-black/30 rounded-xl p-3">${daysHtml}</div><p class="en-num text-sm mt-2">الكلي ${en(r.total)} - السلف ${en(r.adv)} - الصافي <span class="text-amber-400 font-black">${en(r.net)}</span></p></div>`;}).join(''):`<p class="text-center text-zinc-500 mt-10">لا يوجد أرشيف</p>`;}
function closeArchive(){document.getElementById('archiveModal').style.display='none';}
function openBackup(){document.getElementById('backupModal').style.display='flex';}
function closeBackup(){document.getElementById('backupModal').style.display='none';}
function exportBackup(){let data={workers,attendance,advances,archive,exportDate:new Date().toISOString()};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`firas_backup_${fmt(new Date())}.json`;a.click();URL.revokeObjectURL(url);}
function importBackup(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{try{let data=JSON.parse(ev.target.result);if(data.workers)workers=data.workers;if(data.attendance)attendance=data.attendance;if(data.advances)advances=data.advances;if(data.archive)archive=data.archive;save();closeBackup();alert('تم الاستيراد');}catch(err){alert('ملف غير صالح');}};reader.readAsText(file);}
function sendWhatsApp(id){
  let w=workers.find(x=>x.id==id);let weekDays=getWeekDays();
  let weekSum=weekDays.reduce((s,d)=>s+attendanceToFraction(attendance[id]?attendance[id][fmt(d)]:0),0);
  let total=Math.round(weekSum*w.wage);let adv=advances[id]||0;let net=total-adv;
  let lines=weekDays.map(d=>{let ds=fmt(d);let frac=attendanceToFraction(attendance[id]?attendance[id][ds]:0);let isFriday=d.getDay()===5;let label=isFriday?'عطلة':frac==0?'غائب':frac==1?'حاضر':frac==0.5?'نص يوم':`${frac*8} ساعات`;return `${d.toLocaleDateString('ar-IQ',{weekday:'long'})} ${ds}: ${label}`;}).join('\n');
  let msg=`*كشف حساب - ${w.name}*\nالفترة: ${fmt(weekDays[0])} الى ${fmt(weekDays[6])}\nاليومية: ${w.wage}\nعدد الأيام: ${formatDays(weekSum)}\n\n${lines}\n\nالمجموع: ${total} د.ع\nالسلف: ${adv} د.ع\nالصافي: ${net} د.ع`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
}
function sendWhatsAppImage(id){ let w=workers.find(x=>x.id==id);let weekDays=getWeekDays();let weekSum=weekDays.reduce((s,d)=>s+attendanceToFraction(attendance[id]?attendance[id][fmt(d)]:0),0);let total=Math.round(weekSum*w.wage);let adv=advances[id]||0;let net=total-adv;let canvas=document.getElementById('shareCanvas');let ctx=canvas.getContext('2d');ctx.fillStyle='#0f0f0f';ctx.fillRect(0,0,1080,1920);ctx.fillStyle='#1a1a1a';ctx.fillRect(40,40,1000,1840);ctx.strokeStyle='#fbbf24';ctx.lineWidth=4;ctx.strokeRect(40,40,1000,1840);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 70px sans-serif';ctx.fillText(w.name,540,160);ctx.fillStyle='#fbbf24';ctx.font='bold 35px sans-serif';ctx.fillText(`${fmt(weekDays[0])} الى ${fmt(weekDays[6])}`,540,230);let y=350;weekDays.forEach(d=>{let ds=fmt(d);let frac=attendanceToFraction(attendance[id]?attendance[id][ds]:0);let isFriday=d.getDay()===5;let label=isFriday?'عطلة':frac==0?'غائب':frac==1?'حاضر':frac==0.5?'نص يوم':`${frac*8}س`;ctx.fillStyle='#2a2a2a';ctx.fillRect(80,y-35,920,60);ctx.fillStyle=isFriday?'#fbbf24':frac>0?'#22c55e':'#71717a';ctx.font='bold 28px sans-serif';ctx.textAlign='right';ctx.fillText(`${d.toLocaleDateString('ar-IQ',{weekday:'long'})} - ${label}`,900,y);ctx.textAlign='left';ctx.fillStyle='#d4d4d8';ctx.font='24px monospace';ctx.fillText(`${ds}`,90,y);y+=75;});y+=40;ctx.fillStyle='#fbbf24';ctx.font='bold 50px sans-serif';ctx.fillText(`الصافي: ${en(net)} د.ع`,540,y);canvas.toBlob(blob=>{let file=new File([blob],`${w.name}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare({files:[file]})){navigator.share({files:[file]});}else{let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`${w.name}.png`;a.click();}});}
function checkPass(){
  const p = document.getElementById('passInput').value;
  if(p === SITE_PASS){
    localStorage.setItem('siteAuth','1');
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('passInfo').style.display='block';
    document.getElementById('passInfo').innerText = "✅ تم الدخول";
    cloudLoad();
  } else {
    document.getElementById('passError').style.display='block';
    document.getElementById('passError').innerText = "الرمز خطأ!";
  }
}
document.getElementById('passInput').addEventListener('keypress', e=>{ if(e.key==='Enter') checkPass(); });
render();
</script>
