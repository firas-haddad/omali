<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIRAS V3.5.1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
body{font-family:'Tajawal',sans-serif;background:#0f0f0f;color:white}
.en-num{direction:ltr;display:inline-block;unicode-bidi:plaintext;font-family:monospace}
.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body class="pb-28">
<header class="p-4 flex justify-between items-center sticky top-0 z-20 bg-[#0f0f0f]">
<div><h1 class="font-black">حدادة فراس <span class="text-amber-400">V3.5.1</span></h1></div>
<div class="flex gap-2">
<button onclick="openBackup()" class="glass w-10 h-10 rounded-full"><i class="fa-solid fa-floppy-disk"></i></button>
<button onclick="openArchive()" class="glass w-10 h-10 rounded-full"><i class="fa-solid fa-box-archive"></i></button>
</div>
</header>

<div class="px-4 grid grid-cols-3 gap-2 mt-2">
<div class="glass rounded-2xl p-3 text-center"><p class="text-[10px] text-zinc-400">العمال</p><p class="en-num font-black" id="totalWorkers">0</p></div>
<div class="glass rounded-2xl p-3 text-center"><p class="text-[10px] text-zinc-400">حضور اليوم</p><p class="en-num font-black text-green-400" id="todayPresent">0</p></div>
<div class="glass rounded-2xl p-3 text-center"><p class="text-[10px] text-zinc-400">أجور الأسبوع</p><p class="en-num font-black text-amber-400 text-[11px]" id="weekTotal">0</p></div>
</div>

<div class="px-4 mt-3 grid grid-cols-4 gap-2">
<button onclick="markAll(1)" class="bg-zinc-800 py-3 rounded-xl text-[10px] font-bold">الكل حاضر</button>
<button onclick="markAll(0.5)" class="bg-zinc-800 py-3 rounded-xl text-[10px] font-bold">الكل نص</button>
<button onclick="markAllHours()" class="bg-zinc-800 py-3 rounded-xl text-[10px] font-bold">الكل ساعات</button>
<button onclick="markAll(0)" class="bg-zinc-800 py-3 rounded-xl text-[10px] font-bold">الكل غائب</button>
</div>

<div id="workersList" class="px-4 mt-4 space-y-2"></div>
<button onclick="openAddWorker()" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-amber-400 text-black font-black px-8 py-4 rounded-full z-30">+ عامل جديد</button>

<div id="profileModal" class="fixed inset-0 bg-black z-50 hidden overflow-y-auto"><div class="p-4 pb-20">
<div class="flex justify-between items-center">
<button onclick="closeProfile()" class="w-10 h-10 glass rounded-full"><i class="fa-solid fa-xmark"></i></button>
<button onclick="editCurrentWorker()" class="bg-white text-black px-4 py-2 rounded-full text-xs font-black">تعديل</button>
</div>
<div id="profileContent" class="mt-4"></div>
</div></div>

<div id="addModal" class="fixed inset-0 bg-black/90 z-[60] hidden"><div class="bg-zinc-900 w-full mt-auto rounded-t-[30px] p-6 absolute bottom-0">
<h2 id="modalTitle" class="font-black mb-4">إضافة عامل</h2>
<label class="w-24 h-24 rounded-full bg-zinc-800 flex items-center justify-center overflow-hidden mx-auto mb-4 border-2 border-dashed border-zinc-600 cursor-pointer">
<input type="file" id="photoInput" hidden accept="image/*" onchange="previewPhoto(event)"><img id="photoPreview" class="w-full h-full object-cover hidden"><i id="photoIcon" class="fa-solid fa-camera"></i></label>
<input id="wName" placeholder="اسم العامل" class="w-full bg-zinc-800 rounded-xl p-4 mb-3 outline-none">
<input id="wWage" type="number" placeholder="اليومية 50000" class="w-full bg-zinc-800 rounded-xl p-4 mb-4 outline-none en-num">
<input type="hidden" id="editId">
<div class="flex gap-2"><button onclick="saveWorker()" class="flex-1 bg-amber-400 text-black font-black py-4 rounded-xl">حفظ</button><button onclick="closeAdd()" class="flex-1 bg-zinc-800 py-4 rounded-xl">إلغاء</button></div>
</div></div>

<div id="confirmModal" class="fixed inset-0 bg-black/80 z-[70] hidden items-center justify-center p-6"><div class="bg-zinc-900 rounded-[24px] p-6 w-full max-w-sm text-center border border-white/10">
<p id="confirmText" class="font-bold mb-2">متأكد؟</p><p id="confirmSub" class="text-xs text-zinc-400 mb-6"></p>
<div class="flex gap-2"><button id="confirmYes" class="flex-1 bg-green-500 text-black font-black py-4 rounded-xl">تأكيد</button><button onclick="closeConfirm()" class="flex-1 bg-zinc-800 py-4 rounded-xl">إلغاء</button></div>
</div></div>

<div id="hoursModal" class="fixed inset-0 bg-black/80 z-[70] hidden items-center justify-center p-6"><div class="bg-zinc-900 rounded-[24px] p-6 w-full max-w-sm border border-white/10">
<h3 id="hoursTitle" class="font-black mb-4">كم ساعة؟</h3>
<div class="grid grid-cols-4 gap-2 mb-4">
<button onclick="setHours(1)" class="bg-zinc-800 py-3 rounded-xl">1</button>
<button onclick="setHours(2)" class="bg-zinc-800 py-3 rounded-xl">2</button>
<button onclick="setHours(3)" class="bg-zinc-800 py-3 rounded-xl">3</button>
<button onclick="setHours(4)" class="bg-zinc-800 py-3 rounded-xl">4</button>
</div>
<div class="flex gap-2"><input id="customHours" type="number" step="0.5" placeholder="2.5" class="flex-1 bg-zinc-800 rounded-xl p-3 en-num"><button onclick="setCustomHours()" class="bg-amber-400 text-black font-bold px-6 rounded-xl">حفظ</button></div>
<button onclick="closeHours()" class="w-full mt-3 bg-zinc-800 py-3 rounded-xl text-xs">إلغاء</button>
</div></div>

<div id="archiveModal" class="fixed inset-0 bg-black z-[55] hidden overflow-y-auto p-4"><button onclick="closeArchive()" class="w-10 h-10 glass rounded-full mb-4"><i class="fa-solid fa-xmark"></i></button><h2 class="font-black text-xl mb-4">الأرشيف</h2><div id="archiveList"></div></div>

<div id="backupModal" class="fixed inset-0 bg-black/90 z-[55] hidden"><div class="bg-zinc-900 w-full mt-auto rounded-t-[30px] p-6 absolute bottom-0">
<h2 class="font-black mb-4">نسخ احتياطي Google Drive</h2>
<button onclick="exportBackup()" class="w-full bg-white text-black font-bold py-4 rounded-xl mb-2">تصدير ملف JSON</button>
<label class="w-full bg-zinc-800 py-4 rounded-xl flex items-center justify-center cursor-pointer mb-2">استيراد ملف<input type="file" id="importFile" hidden accept=".json" onchange="importBackup(event)"></label>
<button onclick="saveToGoogleDrive()" class="w-full bg-[#1a73e8] text-white font-bold py-4 rounded-xl">فتح Google Drive وحفظ</button>
<p class="text-[10px] text-zinc-500 mt-2 text-center">الملف ينحفظ تلقائيا في المتصفح + تقدر ترفعه لـ Drive</p>
<button onclick="closeBackup()" class="w-full mt-3 bg-zinc-800 py-3 rounded-xl">إغلاق</button>
</div></div>

<canvas id="shareCanvas" width="1080" height="1920" class="hidden"></canvas>

<script>
let workers=JSON.parse(localStorage.getItem('firas_v3_workers')||'[]');
let attendance=JSON.parse(localStorage.getItem('firas_v3_att')||'{}');
let advances=JSON.parse(localStorage.getItem('firas_v3_adv')||'{}');
let archive=JSON.parse(localStorage.getItem('firas_v3_archive')||'[]');
let currentProfileId=null,currentWeekStart=getWeekStart(new Date()),tempPhoto=null,pendingAction=null,hoursTarget=null,isBulkHours=false;

function getWeekStart(d){let dt=new Date(d);let day=dt.getDay();let diff=day===6?0:day+1;dt.setDate(dt.getDate()-diff);dt.setHours(0,0,0,0);return dt;}
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function en(n){return Number(n||0).toLocaleString('en-US');}
function getWeekDays(){let a=[];for(let i=0;i<6;i++){let d=new Date(currentWeekStart);d.setDate(currentWeekStart.getDate()+i);a.push(d);}return a;}
function save(){localStorage.setItem('firas_v3_workers',JSON.stringify(workers));localStorage.setItem('firas_v3_att',JSON.stringify(attendance));localStorage.setItem('firas_v3_adv',JSON.stringify(advances));localStorage.setItem('firas_v3_archive',JSON.stringify(archive));render();if(currentProfileId)renderProfile(currentProfileId);}
function attendanceToFraction(v){if(v===true)return 1;if(!v)return 0;if(typeof v==='number')return v;return 0;}

function render(){
let list=document.getElementById('workersList');list.innerHTML='';let todayStr=fmt(new Date());let present=0,weekTotal=0;let weekDays=getWeekDays();
workers.forEach(w=>{
let frac=attendanceToFraction(attendance[w.id]?attendance[w.id][todayStr]:0);if(frac>0)present++;
let weekSum=weekDays.reduce((s,d)=>s+attendanceToFraction(attendance[w.id]?attendance[w.id][fmt(d)]:0),0);
weekTotal+=weekSum*w.wage;
let statusText=frac==0?'غائب':frac==1?'حاضر':frac==0.5?'نص يوم':`${frac*8}س`;
let div=document.createElement('div');div.className='glass rounded-[20px] p-4 flex items-center justify-between';
div.innerHTML=`<div class="flex items-center gap-3" onclick="openProfile('${w.id}')"><div class="w-14 h-14 rounded-full overflow-hidden bg-zinc-800 flex-shrink-0">${w.photo?`<img src="${w.photo}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center text-zinc-500"><i class="fa-solid fa-user"></i></div>`}</div><div><p class="font-bold">${w.name}</p><p class="text-[11px] text-zinc-400"><span class="en-num">${en(w.wage)}</span> د.ع • ${statusText}</p></div></div><button onclick="quickToggle('${w.id}')" class="w-10 h-10 rounded-full ${frac>0?'bg-green-500 text-black':'bg-zinc-800'}"><i class="fa-solid fa-check"></i></button>`;
list.appendChild(div);
});
document.getElementById('totalWorkers').innerText=workers.length;
document.getElementById('todayPresent').innerText=present;
document.getElementById('weekTotal').innerText=en(Math.round(weekTotal));
}
function quickToggle(id){let today=fmt(new Date());let cur=attendanceToFraction(attendance[id]?attendance[id][today]:0);if(cur>0){askConfirm('حذف حضور اليوم؟','',()=>{delete attendance[id][today];save();});}else{askConfirm('تسجيل حضور؟','',()=>{if(!attendance[id])attendance[id]={};attendance[id][today]=1;save();});}}
function markAll(val){
let labels={1:`حضور الكل اليوم؟`,0.5:`نص يوم للكل؟`,0:`غياب الكل؟`};
askConfirm(labels[val],`التاريخ ${fmt(new Date())} - ${workers.length} عامل`,()=>{
let today=fmt(new Date());
workers.forEach(w=>{if(!attendance[w.id])attendance[w.id]={};if(val===0)delete attendance[w.id][today];else attendance[w.id][today]=val;});
save();
});
}
function markAllHours(){
askConfirm('ساعات للكل اليوم؟',`سيطبق على ${workers.length} عامل`,()=>{
isBulkHours=true;
document.getElementById('hoursModal').style.display='flex';
});
}
function markAllHours(){isBulkHours=true;document.getElementById('hoursModal').style.display='flex';}
function askConfirm(t,s,a){document.getElementById('confirmText').innerText=t;document.getElementById('confirmSub').innerText=s||'';pendingAction=a;document.getElementById('confirmModal').style.display='flex';}
function closeConfirm(){document.getElementById('confirmModal').style.display='none';pendingAction=null;}
document.getElementById('confirmYes').onclick=()=>{if(pendingAction)pendingAction();closeConfirm();};
function openAddWorker(){document.getElementById('addModal').style.display='flex';document.getElementById('modalTitle').innerText='إضافة عامل جديد';document.getElementById('editId').value='';document.getElementById('wName').value='';document.getElementById('wWage').value='';tempPhoto=null;document.getElementById('photoPreview').classList.add('hidden');document.getElementById('photoIcon').classList.remove('hidden');}
function closeAdd(){document.getElementById('addModal').style.display='none';}
function previewPhoto(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas');let size=400;canvas.width=size;canvas.height=size;let ctx=canvas.getContext('2d');let min=Math.min(img.width,img.height);let sx=(img.width-min)/2,sy=(img.height-min)/2;ctx.drawImage(img,sx,sy,min,min,0,0,size,size);tempPhoto=canvas.toDataURL('image/jpeg',0.75);document.getElementById('photoPreview').src=tempPhoto;document.getElementById('photoPreview').classList.remove('hidden');document.getElementById('photoIcon').classList.add('hidden');};img.src=ev.target.result;};reader.readAsDataURL(file);}
function saveWorker(){let n=document.getElementById('wName').value.trim(),w=parseInt(document.getElementById('wWage').value),editId=document.getElementById('editId').value;if(!n||!w)return alert('اكمل البيانات');if(editId){let worker=workers.find(x=>x.id==editId);worker.name=n;worker.wage=w;if(tempPhoto)worker.photo=tempPhoto;}else{let id=Date.now().toString();workers.push({id,name:n,wage:w,photo:tempPhoto});attendance[id]={};advances[id]=0;}tempPhoto=null;closeAdd();save();}
function editCurrentWorker(){let w=workers.find(x=>x.id==currentProfileId);if(!w)return;document.getElementById('modalTitle').innerText='تعديل العامل';document.getElementById('editId').value=w.id;document.getElementById('wName').value=w.name;document.getElementById('wWage').value=w.wage;tempPhoto=w.photo||null;if(w.photo){document.getElementById('photoPreview').src=w.photo;document.getElementById('photoPreview').classList.remove('hidden');document.getElementById('photoIcon').classList.add('hidden');}document.getElementById('addModal').style.display='flex';}
function openProfile(id){currentProfileId=id;document.getElementById('profileModal').style.display='block';renderProfile(id);}
function closeProfile(){document.getElementById('profileModal').style.display='none';currentProfileId=null;}
function renderProfile(id){
let w=workers.find(x=>x.id==id);let weekDays=getWeekDays();
let weekSum=weekDays.reduce((s,d)=>s+attendanceToFraction(attendance[id]?attendance[id][fmt(d)]:0),0);
let total=Math.round(weekSum*w.wage);let adv=advances[id]||0;let net=total-adv;
let html=`<div class="glass rounded-[24px] p-5 text-center"><div class="w-20 h-20 mx-auto rounded-full overflow-hidden bg-zinc-800 border-2 border-amber-400 mb-2">${w.photo?`<img src="${w.photo}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center"><i class="fa-solid fa-user"></i></div>`}</div><h2 class="font-black text-xl">${w.name}</h2><p class="en-num text-amber-400 font-bold">${en(w.wage)} د.ع</p><div class="grid grid-cols-3 gap-2 mt-4"><div class="bg-zinc-800 rounded-xl p-2"><p class="text-[9px] text-zinc-400">حضور</p><p class="en-num font-black">${weekSum.toFixed(1)}/6</p></div><div class="bg-zinc-800 rounded-xl p-2"><p class="text-[9px] text-zinc-400">المستحق</p><p class="en-num font-black text-green-400">${en(total)}</p></div><div class="bg-zinc-800 rounded-xl p-2"><p class="text-[9px] text-zinc-400">الصافي</p><p class="en-num font-black text-amber-400">${en(net)}</p></div></div></div><div class="mt-4 flex justify-between items-center"><button onclick="changeWeek(-1)" class="w-9 h-9 glass rounded-full"><i class="fa-solid fa-chevron-right"></i></button><p class="en-num text-xs font-bold">${fmt(weekDays[0])} الى ${fmt(weekDays[5])}</p><button onclick="changeWeek(1)" class="w-9 h-9 glass rounded-full"><i class="fa-solid fa-chevron-left"></i></button></div><div class="glass rounded-[18px] mt-2 overflow-hidden">${weekDays.map(d=>{let ds=fmt(d);let frac=attendanceToFraction(attendance[id]?attendance[id][ds]:0);let label=frac==0?'غائب':frac==1?'حاضر':frac==0.5?'نص يوم':`${frac*8} ساعات`;return `<div class="p-3 border-b border-white/5"><div class="flex justify-between items-center"><div><p class="text-xs font-bold">${d.toLocaleDateString('ar-IQ',{weekday:'long'})}</p><p class="en-num text-[11px] text-zinc-400">${fmt(d)} • <span class="text-amber-400">${label}</span></p></div><span class="en-num text-[10px] bg-zinc-800 px-2 py-1 rounded-full">${frac>0?en(Math.round(frac*w.wage))+' د.ع':'0'}</span></div><div class="grid grid-cols-4 gap-1 mt-2"><button onclick="askSetDay('${id}','${ds}',1)" class="py-2 rounded-full text-[11px] font-bold ${frac==1?'bg-green-500 text-black':'bg-zinc-800'}">حاضر</button><button onclick="askSetDay('${id}','${ds}',0.5)" class="py-2 rounded-full text-[11px] font-bold ${frac==0.5?'bg-amber-400 text-black':'bg-zinc-800'}">نص</button><button onclick="openHours('${id}','${ds}')" class="py-2 rounded-full text-[11px] ${(frac>0&&frac<1&&frac!=0.5)?'bg-blue-500 text-white':'bg-zinc-800'}">ساعات</button><button onclick="askSetDay('${id}','${ds}',0)" class="py-2 rounded-full text-[11px] ${frac==0?'bg-red-500/20 text-red-400':'bg-zinc-800'}">غائب</button></div></div>`;}).join('')}</div><div class="glass rounded-[18px] p-4 mt-4"><p class="text-xs font-bold mb-2">السلف</p><div class="flex gap-2"><input id="advInput" type="number" placeholder="0" class="flex-1 bg-zinc-800 rounded-xl p-3 en-num outline-none"><button onclick="addAdvance('${id}')" class="bg-amber-400 text-black font-bold px-5 rounded-xl">إضافة</button></div><p class="text-[11px] text-zinc-400 mt-2">مجموع السلف: <span class="en-num">${en(adv)}</span></p></div><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="settleWeek('${id}')" class="bg-white text-black font-black py-4 rounded-xl text-sm">تصفية وتصفير</button><button onclick="sendWhatsAppImage('${id}')" class="bg-[#25D366] text-black font-black py-4 rounded-xl text-sm">إرسال كصورة</button></div><div class="grid grid-cols-1 gap-2 mt-2"><button onclick="sendWhatsApp('${id}')" class="bg-[#25D366]/20 border border-[#25D366]/30 text-[#25D366] font-bold py-4 rounded-xl text-sm">إرسال كشف مفصل واتساب (أيام الأسبوع + الكلي + السلفة + الصافي)</button></div><div class="mt-3 grid grid-cols-2 gap-2"><button onclick="deleteWorker('${id}')" class="bg-red-500/10 border border-red-500/30 text-red-400 font-bold py-3 rounded-xl text-xs"><i class="fa-solid fa-trash ml-1"></i> حذف العامل</button><button onclick="closeProfile()" class="bg-zinc-800 py-3 rounded-xl text-xs">إغلاق</button></div>`;
document.getElementById('profileContent').innerHTML=html;
}
function askSetDay(wId,date,val){askConfirm(val==1?'حاضر كامل؟':val==0.5?'نص يوم؟':'غياب؟',`التاريخ ${date}`,()=>{if(!attendance[wId])attendance[wId]={};if(val==0)delete attendance[wId][date];else attendance[wId][date]=val;save();});}
function openHours(wId,date){hoursTarget={wId,date};isBulkHours=false;document.getElementById('hoursModal').style.display='flex';}
function closeHours(){document.getElementById('hoursModal').style.display='none';hoursTarget=null;isBulkHours=false;document.getElementById('customHours').value='';}
function setHours(h){if(isBulkHours){let frac=h/8;let today=fmt(new Date());workers.forEach(w=>{if(!attendance[w.id])attendance[w.id]={};attendance[w.id][today]=frac;});closeHours();save();return;}if(!hoursTarget)return;let frac=h/8;if(!attendance[hoursTarget.wId])attendance[hoursTarget.wId]={};attendance[hoursTarget.wId][hoursTarget.date]=frac;closeHours();save();}
function setCustomHours(){let h=parseFloat(document.getElementById('customHours').value);if(!h)return;setHours(h);}
function changeWeek(d){let nd=new Date(currentWeekStart);nd.setDate(nd.getDate()+(d*6));currentWeekStart=nd;save();}
function addAdvance(id){let v=parseInt(document.getElementById('advInput').value);if(!v)return;advances[id]=(advances[id]||0)+v;document.getElementById('advInput').value='';save();}
function settleWeek(id){askConfirm('تصفية وتصفير الأسبوع؟','',()=>{let w=workers.find(x=>x.id==id);let weekDays=getWeekDays();let weekSum=weekDays.reduce((s,d)=>s+attendanceToFraction(attendance[id]?attendance[id][fmt(d)]:0),0);if(weekSum==0)return alert('لا يوجد حضور');let total=Math.round(weekSum*w.wage);let adv=advances[id]||0;let rec={id:Date.now().toString(),workerId:id,workerName:w.name,weekStart:fmt(weekDays[0]),weekEnd:fmt(weekDays[5]),days:weekSum,wage:w.wage,total,adv,net:total-adv,date:fmt(new Date())};archive.unshift(rec);weekDays.forEach(d=>{let ds=fmt(d);if(attendance[id])delete attendance[id][ds];});advances[id]=0;save();openArchive();});}
function deleteWorker(id){askConfirm('حذف العامل نهائياً؟','',()=>{workers=workers.filter(w=>w.id!=id);delete attendance[id];delete advances[id];closeProfile();save();});}
function openArchive(){document.getElementById('archiveModal').style.display='block';renderArchive();}
function closeArchive(){document.getElementById('archiveModal').style.display='none';}
function renderArchive() {
  let list = document.getElementById('archiveList');
  if (archive.length == 0) { list.innerHTML = '<p class="text-zinc-500 text-center mt-10">لا يوجد أرشيف</p>'; return; }
  list.innerHTML = archive.map((r, i) => {
    return '<div onclick="showArchiveDetail(' + i + ')" class="glass rounded-xl p-3 mb-2 cursor-pointer"><p class="font-bold text-sm">' + r.workerName + ' • <span class="en-num">' + r.days + ' يوم</span></p><p class="en-num text-[11px] text-zinc-400">' + r.weekStart + ' الى ' + r.weekEnd + ' = ' + en(r.net) + ' د.ع</p><div class="flex gap-2 mt-2"><button onclick="event.stopPropagation();deleteArchive(' + i + ')" style="background:#ff2a2a22;color:#ff5555;border:1px solid #ff2a2a55;border-radius:8px;padding:6px 10px;font-size:12px;flex:1">🗑️ حذف</button><span style="flex:1;text-align:center;font-size:11px;color:#888;padding-top:7px">اضغط للتفاصيل 👁️</span></div></div>';
  }).join('');
}

function showArchiveDetail(idx) {
  let r = archive[idx];
  let daysDetail = '';
  if (r.weekDays) {
    for (let d of r.weekDays) {
      let st = d.status || '';
      let col = (st == 'حاضر') ? '#22c55e' : '#ef4444';
      daysDetail += '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #333"><span>' + (d.day || '') + '</span><span style="color:' + col + '">' + st + '</span></div>';
    }
  } else {
    daysDetail = '<p style="color:#fbbf24;text-align:center;font-size:12px">هذا ارشيف قديم لا يحتوي تفاصيل الايام</p>';
  }
  let html = '<div id="archiveDetailOverlay" style="position:fixed;inset:0;background:#000000cc;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px" onclick="if(event.target==this)closeArchiveDetail()"><div class="glass" style="background:#18181b;border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:80vh;overflow:auto"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-weight:bold">' + r.workerName + '</h3><button onclick="closeArchiveDetail()" style="background:#27272a;border-radius:50%;width:30px;height:30px">✕</button></div><p>من: <span class="en-num">' + r.weekStart + '</span></p><p>الى: <span class="en-num">' + r.weekEnd + '</span></p><p>عدد الايام: <span class="en-num">' + r.days + '</span></p><p>الصافي: <span class="en-num" style="color:#22c55e;font-weight:bold">' + en(r.net) + ' د.ع</span></p><hr style="margin:12px 0;border-color:#333"><p style="font-weight:bold;margin-bottom:6px">تفاصيل ايام الاسبوع:</p><div style="background:#00000055;border-radius:8px;padding:8px">' + daysDetail + '</div><button onclick="closeArchiveDetail()" style="width:100%;margin-top:16px;background:#3f3f46;padding:10px;border-radius:10px">اغلاق</button></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function closeArchiveDetail() {
  let el = document.getElementById('archiveDetailOverlay');
  if (el) el.remove();
}

function deleteArchive(idx) {
  let r = archive[idx];
  askConfirm('حذف ارشيف ' + r.workerName + '؟', r.days + ' يوم = ' + en(r.net) + ' د.ع', function() {
    archive.splice(idx, 1);
    save();
    renderArchive();
    closeArchiveDetail();
  });
}
function deleteArchive(idx){let r=archive[idx];askConfirm(`حذف أرشيف ${r.workerName}؟`,`${r.days} يوم من ${r.weekStart} الى ${r.weekEnd} = ${en(r.net)} د.ع`,()=>{archive.splice(idx,1);save();renderArchive();});}
function sendWhatsApp(id){
let w=workers.find(x=>x.id==id);let weekDays=getWeekDays();
let lines=weekDays.map(d=>{
let ds=fmt(d);let frac=attendanceToFraction(attendance[id]?attendance[id][ds]:0);
let dayName=d.toLocaleDateString('ar-IQ',{weekday:'long'});
let status=frac==0?'غائب':frac==1?'حاضر':frac==0.5?'نص يوم':`${frac*8} ساعات`;
return `${dayName}: ${status}`;
}).join('%0A');
let sum=weekDays.reduce((s,d)=>s+attendanceToFraction(attendance[id]?attendance[id][fmt(d)]:0),0);
let total=Math.round(sum*w.wage);let adv=advances[id]||0;let net=total-adv;
let txt=`*حدادة فراس - كشف حساب*%0Aالعامل: ${w.name}%0Aالاسبوع: ${fmt(weekDays[0])} الى ${fmt(weekDays[5])}%0A----------------%0A${lines}%0A----------------%0Aالحساب الكلي: ${en(total)} د.ع%0Aالسلفة: ${en(adv)} د.ع%0A*صافي الحساب: ${en(net)} د.ع*`;
window.open(`https://wa.me/?text=${txt}`,'_blank');
}
function sendWhatsAppImage(id){
let w=workers.find(x=>x.id==id);let weekDays=getWeekDays();
let weekData=weekDays.map(d=>{let ds=fmt(d);let frac=attendanceToFraction(attendance[id]?attendance[id][ds]:0);return {date:ds,dayName:d.toLocaleDateString('ar-IQ',{weekday:'long'}),frac,amount:Math.round(frac*w.wage)};});
let sum=weekData.reduce((s,x)=>s+x.frac,0);let total=Math.round(sum*w.wage);let adv=advances[id]||0;let net=total-adv;
let c=document.getElementById('shareCanvas');let ctx=c.getContext('2d');
ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,1080,1920);
ctx.fillStyle='#fbbf24';ctx.fillRect(0,0,1080,14);
ctx.fillStyle='#fff';ctx.font='bold 58px Tajawal';ctx.textAlign='right';ctx.fillText('حدادة فراس',1020,90);
ctx.fillStyle='#aaa';ctx.font='22px Tajawal';ctx.fillText('كشف حساب أسبوعي مفصل',1020,125);
ctx.textAlign='left';ctx.fillStyle='#666';ctx.font='20px monospace';ctx.fillText(`${fmt(weekDays[0])} to ${fmt(weekDays[5])}`,60,125);
ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.roundRect(40,160,1000,220,20);ctx.fill();
ctx.fillStyle='#fff';ctx.font='bold 38px Tajawal';ctx.textAlign='right';ctx.fillText(w.name,960,220);
ctx.fillStyle='#fbbf24';ctx.font='26px monospace';ctx.fillText(`${en(w.wage)} IQD / DAY`,960,260);
let y=420;ctx.fillStyle='#222';ctx.fillRect(40,y,1000,50);
ctx.fillStyle='#888';ctx.font='18px Tajawal';ctx.textAlign='right';ctx.fillText('اليوم',900,y+32);ctx.textAlign='center';ctx.fillText('التاريخ',600,y+32);ctx.fillText('الحالة',350,y+32);ctx.fillText('المبلغ',120,y+32);
y+=60;
weekData.forEach(row=>{
ctx.fillStyle=row.frac==0?'#1a0a0a':row.frac==1?'#0a1a0a':'#1a1a0a';ctx.fillRect(40,y,1000,58);
ctx.fillStyle='#fff';ctx.font='20px Tajawal';ctx.textAlign='right';ctx.fillText(row.dayName,900,y+36);
ctx.font='18px monospace';ctx.textAlign='center';ctx.fillStyle='#aaa';ctx.fillText(row.date,600,y+36);
let status=row.frac==0?'غائب':row.frac==1?'حاضر':row.frac==0.5?'نص يوم':`${row.frac*8} ساعات`;
ctx.fillStyle=row.frac==0?'#ef4444':row.frac==1?'#22c55e':'#fbbf24';ctx.fillText(status,350,y+36);
ctx.fillStyle='#fff';ctx.font='bold 18px monospace';ctx.fillText(`${en(row.amount)}`,120,y+36);
y+=66;
});
y+=10;ctx.fillStyle='#fbbf24';ctx.fillRect(40,y,1000,2);y+=40;
ctx.fillStyle='#fff';ctx.font='22px monospace';ctx.textAlign='left';
ctx.fillText(`Total: ${en(total)} IQD`,60,y);y+=40;
ctx.fillText(`Advance: ${en(adv)} IQD`,60,y);y+=70;
ctx.fillStyle='#fbbf24';ctx.font='bold 48px monospace';ctx.fillText(`NET: ${en(net)} IQD`,60,y);
c.toBlob(async blob=>{
let file=new File([blob],`${w.name}.png`,{type:'image/png'});
if(navigator.canShare && navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:`كشف ${w.name}`,text:`${w.name} ${en(net)}`});return;}catch(e){}}
let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>sendWhatsApp(id),800);
},'image/png');
}
function openBackup(){document.getElementById('backupModal').style.display='block';}
function closeBackup(){document.getElementById('backupModal').style.display='none';}
function exportBackup(){let data={workers,attendance,advances,archive,date:fmt(new Date())};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`firas-backup-${fmt(new Date())}.json`;a.click();}
function importBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=ev=>{try{let d=JSON.parse(ev.target.result);workers=d.workers||[];attendance=d.attendance||{};advances=d.advances||{};archive=d.archive||[];save();alert('تم الاستيراد');closeBackup();}catch{alert('ملف خطأ');}};r.readAsText(file);}
function saveToGoogleDrive(){exportBackup();window.open('https://drive.google.com/drive/my-drive','_blank');}
render();
</script>
